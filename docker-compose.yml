services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: menufast-api
    ports:
      - "5165:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=host.docker.internal/SQLEXPRESS;Database=MenuFastDb;Integrated Security=True;TrustServerCertificate=True;Encrypt=False"
      ConnectionStrings__Redis: "redis:6379"
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: menufast-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
